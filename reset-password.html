<body data-page="reset-password">
<a class="skip-link" href="#main">Skip to content</a>
<div id="site-announcement"></div>
<div id="site-header"></div>
<section class="page-banner"><div class="container"><nav aria-label="Breadcrumb"><ul class="crumbs"><li><a href="index.html">Home</a></li><li><a href="login.html">Log In</a></li><li aria-current="page">New Password</li></ul></nav><h1>Choose a New Password</h1><p>Make it one you don’t use anywhere else.</p></div></section>
<main id="main" class="page-body"><noscript><p class="notice notice--noscript">This page needs JavaScript. Please enable it in your browser, or call us to order.</p></noscript>
  <div class="container"><div class="auth auth--single">
      <div class="auth__card">
        <h2>Set your new password</h2>
        <p class="form-msg" id="formMsg" role="alert" hidden></p>
        <form id="resetForm" class="form-grid" novalidate>
          <div class="field"><label for="resetPassword">New password</label><div class="pw"><input id="resetPassword" name="resetPassword" type="password" autocomplete="new-password" required><button type="button" class="pw__toggle" data-pw-toggle="resetPassword" aria-pressed="false" aria-label="Show or hide password">Show</button></div><p class="field__error" id="resetPasswordErr"></p><p class="field__hint">At least 8 characters.</p></div>
          <div class="field"><label for="resetConfirm">Confirm new password</label><div class="pw"><input id="resetConfirm" name="resetConfirm" type="password" autocomplete="new-password" required><button type="button" class="pw__toggle" data-pw-toggle="resetConfirm" aria-pressed="false" aria-label="Show or hide password">Show</button></div><p class="field__error" id="resetConfirmErr"></p></div>
          <button type="submit" class="btn btn--primary btn--block">Save Password</button>
        </form>
        <p class="auth__alt"><a class="text-link" href="login.html">Back to log in</a></p>
      </div>
      
    </div></div>
</main>
