<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop All | Ashfi Collection</title>
  <meta name="description" content="Browse the full Ashfi Collection range – kurti, two piece, three piece, saree and orna. Filter by category and price, with nationwide delivery in Bangladesh.">
  <meta name="theme-color" content="#722F45">
  <meta name="robots" content="index,follow">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Ashfi Collection">
  <meta property="og:title" content="Shop All | Ashfi Collection">
  <meta property="og:description" content="Browse the full Ashfi Collection range – kurti, two piece, three piece, saree and orna. Filter by category and price, with nationwide delivery in Bangladesh.">
  <meta property="og:image" content="https://ashficollection.com/images/og-cover.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://ashficollection.com/shop.html">
  <meta property="og:locale" content="en_BD">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Pinyon+Script&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="shop">
<a class="skip-link" href="#main">Skip to content</a>
<div id="site-announcement"></div>
<div id="site-header"></div>
<section class="page-banner"><div class="container"><nav aria-label="Breadcrumb"><ul class="crumbs"><li><a href="index.html">Home</a></li><li aria-current="page">Shop</li></ul></nav><h1 id="shopTitle">All Products</h1><p id="shopTitleSub">Discover elegant outfits for every occasion.</p></div></section>
<main id="main" class="page-body page-body--tight">
  <div class="container">
    <div class="shop">
      <div class="overlay" id="filterOverlay" hidden></div>
      <aside class="filters" id="filters" aria-label="Product filters">
        <div class="filters__head"><h2>Filters</h2><button type="button" class="icon-btn" id="filterClose" aria-label="Close filters"><span data-ic="x"></span></button></div>
        <div class="filters__body">
          <div class="f-group"><h3>Category</h3><div id="fCats"></div></div>
          <div class="f-group"><h3>Price (৳)</h3>
            <div class="price-inputs">
              <label><span aria-hidden="true">৳</span><input type="number" id="pMin" inputmode="numeric" min="0" placeholder="Min" aria-label="Minimum price"></label>
              <span aria-hidden="true">–</span>
              <label><span aria-hidden="true">৳</span><input type="number" id="pMax" inputmode="numeric" min="0" placeholder="Max" aria-label="Maximum price"></label>
            </div>
            <div class="chips" id="pChips"></div>
          </div>
          <div class="f-group"><h3>Show only</h3>
            <label class="f-opt"><input type="checkbox" id="fSale"> On sale</label>
            <label class="f-opt"><input type="checkbox" id="fNew"> New arrivals</label>
            <label class="f-opt"><input type="checkbox" id="fBest"> Best sellers</label>
          </div>
        </div>
        <div class="filters__foot"><button type="button" class="btn btn--outline" id="fClearM">Clear all</button><button type="button" class="btn btn--primary" id="fApply">Show results</button></div>
      </aside>

      <section aria-label="Products">
        <form class="shop-search" id="shopSearch" role="search">
          <span data-ic="search"></span>
          <input type="search" id="shopQ" placeholder="Search products…" aria-label="Search products" autocomplete="off">
          <button type="button" id="shopQClear" aria-label="Clear search" hidden><span data-ic="x"></span></button>
        </form>
        <div class="shop__bar">
          <p class="shop__count" id="shopCount" role="status" aria-live="polite"></p>
          <div class="shop__controls">
            <button type="button" class="btn btn--outline btn--sm shop__filter-btn" id="filterOpen"><span data-ic="sliders"></span> Filters</button>
            <label class="sr-only" for="sortSel">Sort products</label>
            <select class="select" id="sortSel">
              <option value="latest">Latest</option>
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
              <option value="discount">Biggest Discount</option>
            </select>
          </div>
        </div>
        <div class="active-filters" id="activeFilters"></div>
        <div class="shop__results"><div class="grid" id="shopGrid"></div></div>
      </section>
    </div>
  </div>
</main>

<div id="site-footer"></div>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/components.js"></script>
<script src="js/shop.js"></script>

</body>
</html>
