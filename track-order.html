<body data-page="track-order">
<a class="skip-link" href="#main">Skip to content</a>
<div id="site-announcement"></div>
<div id="site-header"></div>
<section class="page-banner"><div class="container"><nav aria-label="Breadcrumb"><ul class="crumbs"><li><a href="index.html">Home</a></li><li aria-current="page">Track Order</li></ul></nav><h1>Track Your Order</h1><p>Enter your details to see where your order is.</p></div></section>
<main id="main" class="page-body"><noscript><p class="notice notice--noscript">This page needs JavaScript. Please enable it in your browser, or call us to order.</p></noscript>
  <div class="container"><div class="track">
    <form id="trackForm" class="panel form-grid" novalidate>
      <h2>Find your order</h2>
      <p class="form-msg" id="formMsg" role="alert" hidden></p>
      <div class="field"><label for="trackNumber">Order number</label><input id="trackNumber" name="trackNumber" type="text" autocomplete="off" required placeholder="AC-XXXXXXXX" spellcheck="false"><p class="field__error" id="trackNumberErr"></p></div>
      <div class="field"><label for="trackPhone">Mobile number used for the order</label><input id="trackPhone" name="trackPhone" type="tel" autocomplete="tel" required inputmode="tel" placeholder="01XXXXXXXXX"><p class="field__error" id="trackPhoneErr"></p></div>
      <button type="submit" class="btn btn--primary btn--block">Track Order</button>
      <p class="field__hint">Your order number is on your confirmation page. In this demo, orders can only be tracked from the browser they were placed in.</p>
    </form>
    <div id="trackResult" tabindex="-1"></div>
  </div></div>
</main>
